<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AWS Cloud Resource Management Dashboard</title>
  <script src="chart.min.js"></script>
  <style>
    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2e3250;
      --text:    #e8eaf2;
      --muted:   #7b82a8;
      --green:   #22c55e;
      --red:     #ef4444;
      --blue:    #3b82f6;
      --yellow:  #f59e0b;
      --purple:  #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand { font-weight: 600; font-size: 16px; }
    main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px; margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.25rem;
    }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; }
    .stat-sub   { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 2rem; }
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.25rem;
    }
    .panel-title { font-weight: 600; margin-bottom: 1rem; }
    .chart-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.25rem; margin-bottom: 2rem; width: 100%;
    }
    .section-title {
      font-size: 13px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; color: var(--muted); font-size: 11px;
      text-transform: uppercase; padding: 6px 0 8px;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 9px 0; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .badge-green { background: rgba(34,197,94,.15); color: var(--green); }
    .badge-red   { background: rgba(239,68,68,.15);  color: var(--red); }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 4rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .refresh-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .refresh-btn:hover { background: var(--border); }
    #last-updated { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">AWS Cloud Resource Management Dashboard</div>
  <div style="display:flex; align-items:center; gap:12px;">
    <span id="last-updated"></span>
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</nav>

<main>
  <div id="loading"><div class="spinner"></div></div>

  <div id="dashboard" style="display:none">

    <div class="stats-grid" id="stats-grid"></div>

    <p class="section-title">Monthly Cost — Last 6 Months</p>
    <div class="chart-panel">
      <canvas id="cost-chart" height="80" style="width:100% !important"></canvas>
    </div>

    <p class="section-title">Resources</p>
    <div class="two-col">
      <div class="panel">
        <div class="panel-title">EC2 Instances</div>
        <div id="ec2-table"></div>
      </div>
      <div class="panel">
        <div class="panel-title">S3 Buckets</div>
        <div id="s3-list"></div>
      </div>
    </div>

    <p class="section-title">IAM Summary</p>
    <div class="panel" id="iam-summary"></div>

    <p class="section-title" style="margin-top:2rem">Budget Status</p>
    <div class="panel" id="budget-panel"></div>

    <p class="section-title" style="margin-top:2rem">Recent Activities</p>
    <div class="panel" id="activities-panel"></div>

    <p class="section-title" style="margin-top:2rem">Snapshot History</p>
    <div class="panel" id="history-panel"></div>

  </div>
</main>

<script>
  const API_URL = "https://beeix39iuh.execute-api.ap-south-1.amazonaws.com/prod/data";

  let costChart = null;

    function renderBudgets(budgets) {
    if (!budgets?.length) {
      document.getElementById("budget-panel").innerHTML =
        '<p style="color:#7b82a8;font-size:13px;padding:1rem 0">No budgets configured</p>';
      return;
    }

    document.getElementById("budget-panel").innerHTML = budgets.map(b => {
      const pct     = b.limit > 0 ? Math.min((b.actual / b.limit) * 100, 100) : 0;
      const color   = pct >= 100 ? "#ef4444" : pct >= 80 ? "#f59e0b" : "#22c55e";
      const status  = pct >= 100 ? "⚠ EXCEEDED" : pct >= 80 ? "⚠ WARNING" : "✓ ON TRACK";

      return `
        <div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <span style="font-weight:600;font-size:14px">${b.name}</span>
            <span style="color:${color};font-weight:600;font-size:13px">${status}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#7b82a8;margin-bottom:6px">
            <span>Spent: <strong style="color:#e8eaf2">$${b.actual.toFixed(2)}</strong></span>
            <span>Forecasted: <strong style="color:#e8eaf2">$${b.forecasted.toFixed(2)}</strong></span>
            <span>Limit: <strong style="color:#e8eaf2">$${b.limit.toFixed(2)}</strong></span>
          </div>
          <div style="background:#22263a;border-radius:6px;height:8px;overflow:hidden">
            <div style="background:${color};height:100%;width:${pct}%;border-radius:6px;transition:width 0.5s"></div>
          </div>
          <div style="text-align:right;font-size:11px;color:#7b82a8;margin-top:4px">${pct.toFixed(1)}% used</div>
        </div>
      `;
    }).join("");
  }

    function renderHistory(history) {
    if (!history?.length) {
      document.getElementById("history-panel").innerHTML =
        '<p style="color:#7b82a8;font-size:13px;padding:1rem 0">No history yet — refresh a few times to build history</p>';
      return;
    }

    const rows = history.map(h => `
      <tr>
        <td style="color:#7b82a8;font-size:11px">${new Date(h.timestamp + "Z").toLocaleString("en-IN", {timeZone: "Asia/Kolkata"})}</td>
        <td style="text-align:center">${h.ec2_total}</td>
        <td style="text-align:center;color:#22c55e">${h.ec2_running}</td>
        <td style="text-align:center">${h.s3_total}</td>
        <td style="text-align:center;color:#3b82f6">$${parseFloat(h.cost_month).toFixed(2)}</td>
      </tr>
    `).join("");

    document.getElementById("history-panel").innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th style="text-align:center">EC2 Total</th>
            <th style="text-align:center">Running</th>
            <th style="text-align:center">S3 Buckets</th>
            <th style="text-align:center">Cost</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  async function loadData() {
    document.getElementById("loading").style.display = "block";
    document.getElementById("dashboard").style.display = "none";

    try {
      const response = await fetch(API_URL);
      const raw = await response.json();

      const data = typeof raw.body === "string" ? JSON.parse(raw.body) : raw;

      renderStats(data);
      renderCostChart(data.cost);
      renderEC2(data.ec2);
      renderS3(data.s3);
      renderIAM(data.summary);
      renderActivities(data.activities);
      renderBudgets(data.budgets);
      renderHistory(data.history);

      document.getElementById("last-updated").textContent =
        "Updated " + new Date().toLocaleTimeString();
      document.getElementById("loading").style.display = "none";
      document.getElementById("dashboard").style.display = "block";

    } catch (error) {
      document.getElementById("loading").innerHTML =
        '<p style="color:#ef4444;text-align:center;padding:2rem">Error: ' + error.message + '</p>';
    }
  }

  function renderStats(data) {
    const cards = [
      { label: "This Month",   value: "$" + (data.cost?.current_month ?? 0).toFixed(2), sub: "AWS cost (USD)", color: "#3b82f6" },
      { label: "Running EC2",  value: data.ec2?.running ?? 0, sub: "of " + (data.ec2?.total ?? 0) + " total", color: "#22c55e" },
      { label: "Stopped EC2",  value: data.ec2?.stopped ?? 0, sub: "not billing compute", color: "#f59e0b" },
      { label: "S3 Buckets",   value: data.s3?.total ?? 0, sub: "storage buckets", color: "#8b5cf6" },
      { label: "IAM Users",    value: data.summary?.users ?? 0,
        sub: data.summary?.mfa_enabled ? "✓ MFA on" : "⚠ MFA off",
        color: data.summary?.mfa_enabled ? "#22c55e" : "#ef4444" }
    ];
    document.getElementById("stats-grid").innerHTML = cards.map(c => `
      <div class="stat-card">
        <div class="stat-label">${c.label}</div>
        <div class="stat-value" style="color:${c.color}">${c.value}</div>
        <div class="stat-sub">${c.sub}</div>
      </div>
    `).join("");
  }

  function renderCostChart(cost) {
    if (!cost?.monthly?.length) return;
    const labels = cost.monthly.map(m => m.month);
    const values = cost.monthly.map(m => m.total);
    if (costChart) costChart.destroy();
    const allZero = values.every(v => v === 0 || Object.is(v, -0));
    const displayValues = allZero ? values.map(() => 0.003) : values;

    costChart = new Chart(document.getElementById("cost-chart"), {
      type: "bar",
      data: {
        labels,
        datasets: [{
          label: "Cost (USD)", data: displayValues,
          backgroundColor: "rgba(59,130,246,0.5)",
          borderColor: "rgba(59,130,246,0.9)",
          borderWidth: 1, borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => " $" + values[ctx.dataIndex].toFixed(2)
            }
          }
        },
        scales: {
          x: { grid: { color: "rgba(255,255,255,0.04)" }, ticks: { color: "#7b82a8" } },
          y: {
            grid: { color: "rgba(255,255,255,0.04)" },
            ticks: {
              color: "#7b82a8",
              callback: v => {
                if (v >= 1) return "$" + v.toFixed(2);
                if (v >= 0.01) return "$" + v.toFixed(2);
                return "$" + v.toFixed(4);
              }
            }
          }
        }
      }
    });
  }

  function renderEC2(ec2) {
    if (!ec2?.list?.length) {
      document.getElementById("ec2-table").innerHTML =
        '<p style="color:#7b82a8;font-size:13px;padding:1rem 0">No EC2 instances found</p>';
      return;
    }
    const rows = ec2.list.map(i => `
      <tr>
        <td>
          <div style="font-weight:500">${i.name}</div>
          <div style="font-size:11px;color:#7b82a8">${i.id}</div>
        </td>
        <td style="color:#7b82a8">${i.type}</td>
        <td><span class="badge ${i.state === 'running' ? 'badge-green' : 'badge-red'}">${i.state}</span></td>
      </tr>
    `).join("");
    document.getElementById("ec2-table").innerHTML = `
      <table>
        <thead><tr><th>Name / ID</th><th>Type</th><th>State</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function renderS3(s3) {
    if (!s3?.list?.length) {
      document.getElementById("s3-list").innerHTML =
        '<p style="color:#7b82a8;font-size:13px;padding:1rem 0">No S3 buckets found</p>';
      return;
    }
    document.getElementById("s3-list").innerHTML = s3.list.map(b => `
      <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2e3250">
        <span style="font-size:18px">🗂</span>
        <div>
          <div style="font-weight:500;font-size:13px">${b.name}</div>
          <div style="font-size:11px;color:#7b82a8">Created ${b.created.substring(0,10)}</div>
        </div>
      </div>
    `).join("");
  }

  function renderIAM(iam) {
    const items = [
      { label: "Users",    value: iam?.users    ?? 0, color: "#3b82f6" },
      { label: "Roles",    value: iam?.roles    ?? 0, color: "#8b5cf6" },
      { label: "Policies", value: iam?.policies ?? 0, color: "#14b8a6" },
      { label: "MFA",      value: iam?.mfa_enabled ? "✓" : "✗",
        color: iam?.mfa_enabled ? "#22c55e" : "#ef4444" }
    ];
    document.getElementById("iam-summary").innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
        ${items.map(i => `
          <div style="background:#22263a;border-radius:8px;padding:12px;text-align:center">
            <div style="font-size:24px;font-weight:700;color:${i.color}">${i.value}</div>
            <div style="font-size:11px;color:#7b82a8;margin-top:4px">${i.label}</div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function renderActivities(activities) {
    if (!activities?.length) {
      document.getElementById("activities-panel").innerHTML =
        '<p style="color:#7b82a8;font-size:13px;padding:1rem 0">No recent activities found</p>';
      return;
    }

    function getTip(action) {
      const tips = {
        "RunInstances":           { msg: "⚠ EC2 instance launched and consuming free tier hours. Stop it when not in use to save credits.", color: "#f59e0b" },
        "StartInstances":         { msg: "⚠ EC2 instance started. Free tier gives only 750 hours/month.", color: "#f59e0b" },
        "StopInstances":          { msg: "✓ Good job stopping the instance. No compute charges while stopped.", color: "#22c55e" },
        "TerminateInstances":     { msg: "✓ Instance terminated. No further charges for this instance.", color: "#22c55e" },
        "RebootInstances":        { msg: "ℹ Instance rebooted. Billing continues during reboot.", color: "#3b82f6" },
        "ModifyInstanceAttribute":{ msg: "ℹ Instance modified. Restart may be required.", color: "#3b82f6" },
        "CreateBucket":           { msg: "ℹ S3 bucket created. Free tier gives 5GB storage — monitor usage.", color: "#3b82f6" },
        "DeleteBucket":           { msg: "✓ Bucket deleted. Storage charges stopped.", color: "#22c55e" },
        "PutBucketPolicy":        { msg: "⚠ Bucket policy changed. Make sure public access is intentional.", color: "#f59e0b" },
        "PutBucketWebsite":       { msg: "ℹ Static website hosting enabled on bucket.", color: "#3b82f6" },
        "PutPublicAccessBlock":   { msg: "⚠ Public access settings changed. Review bucket visibility.", color: "#f59e0b" },
        "CreateUser":             { msg: "ℹ New IAM user created. Follow least privilege.", color: "#3b82f6" },
        "DeleteUser":             { msg: "✓ IAM user deleted.", color: "#22c55e" },
        "AttachUserPolicy":       { msg: "⚠ Policy attached to user. Review permissions regularly.", color: "#f59e0b" },
        "DetachUserPolicy":       { msg: "✓ Policy removed from user.", color: "#22c55e" },
        "AttachRolePolicy":       { msg: "⚠ Policy attached to role. Ensure least privilege is followed.", color: "#f59e0b" },
        "CreateRole":             { msg: "ℹ IAM role created. Roles are safer than access keys.", color: "#3b82f6" },
        "DeleteRole":             { msg: "✓ IAM role deleted.", color: "#22c55e" },
        "CreateAccessKey":        { msg: "⚠ Access key created. Never share or commit it to GitHub.", color: "#ef4444" },
        "DeleteAccessKey":        { msg: "✓ Access key deleted. Good security practice.", color: "#22c55e" },
        "EnableMFADevice":        { msg: "✓ MFA enabled. Your account is now more secure.", color: "#22c55e" },
        "CreateFunction20150331": { msg: "ℹ Lambda function created. Free tier gives 1M requests/month.", color: "#3b82f6" },
        "DeleteFunction":         { msg: "✓ Lambda function deleted. No further charges.", color: "#22c55e" },
        "UpdateFunctionCode20150331v2": { msg: "ℹ Lambda code updated and deployed.", color: "#3b82f6" },
        "CreateRestApi":          { msg: "ℹ API Gateway created. Free tier gives 1M calls/month.", color: "#3b82f6" },
        "CreateDeployment":       { msg: "ℹ API deployed to stage. Your endpoint is now live.", color: "#3b82f6" },
        "PutMetricAlarm":         { msg: "✓ Billing alarm set. You will be notified if costs exceed threshold.", color: "#22c55e" },
        "DeleteAlarms":           { msg: "⚠ Alarm deleted. You may no longer get billing notifications.", color: "#f59e0b" },
        "CreateTopic":            { msg: "ℹ SNS topic created. First 1000 emails/month are free.", color: "#3b82f6" },
        "Subscribe":              { msg: "ℹ Subscription created. Confirm it in your email inbox.", color: "#3b82f6" },
        "CreateTrail":            { msg: "✓ CloudTrail enabled. All AWS actions are now being logged.", color: "#22c55e" },
        "DeleteTrail":            { msg: "⚠ CloudTrail deleted. AWS actions are no longer being tracked.", color: "#ef4444" },
        "CreateDBInstance":       { msg: "⚠ RDS instance running. Free tier gives 750 hours/month. Stop when not in use.", color: "#f59e0b" },
        "StopDBInstance":         { msg: "✓ RDS stopped. No compute charges while stopped.", color: "#22c55e" },
        "DeleteDBInstance":       { msg: "✓ RDS deleted. No further charges.", color: "#22c55e" },
      };
      return tips[action] || null;
    }

    const rows = activities.map(a => {
      const time      = new Date(a.time);
        const formatted = time.toLocaleString("en-IN", {
          timeZone: "Asia/Kolkata",
          day: "2-digit", month: "2-digit", year: "numeric",
          hour: "2-digit", minute: "2-digit"
        });

      const isCreate = a.action.startsWith("Create") || a.action.startsWith("Run") || a.action.startsWith("Start") || a.action.startsWith("Enable");
      const isDelete = a.action.startsWith("Delete") || a.action.startsWith("Terminate") || a.action.startsWith("Stop");
      const color    = isCreate ? "#22c55e" : isDelete ? "#ef4444" : "#3b82f6";

      const tip = getTip(a.action);
      const tipHTML = tip ? `
        <tr>
          <td colspan="4" style="padding:4px 0 10px 0">
            <div style="
              border-left: 3px solid ${tip.color};
              background: rgba(0,0,0,0.2);
              border-radius: 4px;
              padding: 8px 12px;
              font-size: 12px;
              color: ${tip.color};
            ">${tip.msg}</div>
          </td>
        </tr>` : "";

      return `
        <tr>
          <td style="color:#7b82a8;font-size:11px;white-space:nowrap">${formatted}</td>
          <td style="color:#7b82a8;font-size:12px">${a.user}</td>
          <td><span style="color:${color};font-weight:500;font-size:13px">${a.action}</span></td>
          <td style="font-size:12px;color:#e8eaf2;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.resource}</td>
        </tr>
        ${tipHTML}
      `;
    }).join("");

    document.getElementById("activities-panel").innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>User</th>
            <th>Action</th>
            <th>Resource</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }
  loadData();
</script>
</body>
</html>
